name: ArcadePad
options:
  bundleIdPrefix: com.dlrk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  ArcadePad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArcadePad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dlrk.arcadepad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ArcadePad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ArcadePad needs the microphone to record samples you can play from the pad grid."
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"ArcadePad/Preview Content\""
        ENABLE_PREVIEWS: YES
    info:
      path: Generated-Info.plist
      properties: {}
  ArcadePadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArcadePadTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dlrk.arcadepad.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ArcadePad
  ArcadePadUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArcadePadUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dlrk.arcadepad.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ArcadePad
schemes:
  ArcadePad:
    build:
      targets:
        ArcadePad: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArcadePadTests
        - ArcadePadUITests
